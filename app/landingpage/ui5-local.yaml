specVersion: "4.0"
metadata:
  name: goalittech.ui
type: application
framework:
  name: SAPUI5
  version: 1.153.0
  libraries:
    - name: sap.m
    - name: sap.tnt
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.f
    - name: sap.ui.comp
    - name: sap.ui.generic.app
    - name: sap.ui.table
    - name: sap.ushell
    - name: themelib_sap_bluecrystal
    - name: themelib_sap_horizon
builder:
  customTasks:
    - name: component-configuration-task
      beforeTask: generateComponentPreload
server:
  customMiddleware:
    - name: component-configuration-middleware
      beforeMiddleware: serveResources
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: goalittech.ui
        ui5Theme: sap_horizon

---
specVersion: "4.0"
kind: extension
type: server-middleware
metadata:
  name: component-configuration-middleware
middleware:
  path: tools/componentConfigurationMiddleware.js
---
specVersion: "4.0"
kind: extension
type: task
metadata:
  name: component-configuration-task
task:
  path: tools/componentConfigurationTask.js

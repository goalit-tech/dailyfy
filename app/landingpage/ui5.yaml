specVersion: "4.0"
metadata:
  name: goalittech.ui
type: application
builder:
  customTasks:
    - name: component-configuration-task
      beforeTask: generateComponentPreload
server:
  customMiddleware:
    - name: component-configuration-middleware
      beforeMiddleware: serveResources
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
          version: 1.153.0
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: goalittech.ui
        ui5Theme: sap_horizon

---
specVersion: "4.0"
kind: extension
type: server-middleware
metadata:
  name: component-configuration-middleware
middleware:
  path: ../../srv/ui-component-middleware/index.js
---
specVersion: "4.0"
kind: extension
type: task
metadata:
  name: component-configuration-task
task:
  path: ../../srv/ui-component-middleware/index.js
